<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Visor 3D · El ciclo del agua en mi casa</title><link rel="stylesheet" href="css/estilos.css?v=20261026d">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="js/experiencia.js?v=20261026d"></script>
<style>html,body{height:100%;margin:0;overflow:hidden;background:#0E2240}html,body,a-scene,canvas{touch-action:none}:root{--zTop:44px;--zBot:44px}.aviso{font-size:clamp(9px,2.6vw,11px)!important}body{background:radial-gradient(circle at 50% 40%,#123d6b,#0E2240 70%)}</style></head><body>
<div class="barra"><span>Visor 3D (sin cámara)</span><span><a href="index.html" style="color:#fff;margin-right:8px">RA</a><button style="padding:4px 10px;margin:0" onclick="panelInfo()">ℹ</button></span></div>
<div id="panel" class="panel oculto"></div>
<a-scene embedded style="position:fixed;inset:0" renderer="colorManagement: true; antialias: true; alpha: true" vr-mode-ui="enabled: false" background="color: #0E2240">
 <a-entity light="type: ambient; intensity: 0.9"></a-entity><a-entity light="type: directional; intensity: 0.8" position="0.5 1 1"></a-entity>
 <a-camera id="cam" position="0 -0.08 1.4" look-controls="enabled: false" wasd-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clicable"></a-camera>
 <a-entity id="raiz" experiencia position="0 0.02 0"></a-entity></a-scene>
<p class="aviso" style="position:fixed;bottom:6px;left:0;right:0;text-align:center;color:#cbd5e0">Arrastra para girar · pellizca o rueda para escalar · Agenda Ambiental UASLP ext. 7200 y 7210</p>
