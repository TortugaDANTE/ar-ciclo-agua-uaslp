<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El ciclo del agua en mi casa · Agenda Ambiental UASLP</title><link rel="stylesheet" href="css/estilos.css">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="js/experiencia.js"></script></head><body>
<div id="splash" class="capa"><div class="logos"><img src="assets/logos/logo_uaslp_corner.svg" alt="UASLP"><img src="assets/logos/logo_aa.svg" alt="Agenda Ambiental UASLP"></div></div>
<div id="intro" class="capa oculto"><h1>El ciclo del agua en mi casa</h1><p id="txtIntro"></p>
<p><b>Capto → Potabilizo → Uso y ahorro → Trato y reúso → Devuelvo al suelo</b></p>
<button id="bIniciar">Iniciar cámara y apuntar al cartel</button><button onclick="location.href='visor.html'">Ver sin cámara</button>
<p class="aviso">Contacto Agenda Ambiental UASLP: ext. 7200 y 7210</p></div>
<div class="barra"><span>El ciclo del agua en mi casa</span><button style="padding:4px 10px;margin:0" onclick="panelInfo()">ℹ</button></div>
<div id="panel" class="panel oculto"></div>
<a-scene id="escena" mindar-image="autoStart: false; uiScanning: yes" color-space="sRGB" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
 <a-entity light="type: ambient; intensity: 0.9"></a-entity><a-entity light="type: directional; intensity: 0.8" position="0.5 1 1"></a-entity>
 <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clicable"></a-camera>
 <a-entity mindar-image-target="targetIndex: 0"><a-entity experiencia></a-entity></a-entity></a-scene>
<script src="js/app.js"></script>
<script>
setTimeout(()=>{$('#splash').classList.add('oculto');$('#intro').classList.remove('oculto')},1500);
cargarContenido().then(c=>$('#txtIntro').textContent=c.intro);
const sc=document.querySelector('#escena');
// Línea de diagnóstico (ocultar con ?debug=0)
const dbg=document.createElement('div');dbg.id='dbg';dbg.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0E2240cc;color:#5AE0F0;font:12px monospace;padding:4px 8px';
if(new URLSearchParams(location.search).get('debug')!=='0')document.body.appendChild(dbg);
const estado=t=>{dbg.textContent='Estado: '+t;console.log('[AR] '+t);};estado('listo, toca Iniciar');
const tgt=document.querySelector('[mindar-image-target]');
tgt.addEventListener('targetFound',()=>{window.encontrado=true;estado('marcador detectado');});
tgt.addEventListener('targetLost',()=>estado('buscando marcador'));
sc.addEventListener('arReady',()=>estado('cámara OK · buscando marcador'));
sc.addEventListener('arError',ev=>estado('error: no se pudo iniciar la cámara/RA'));
$('#bIniciar').onclick=async()=>{ // el gesto del usuario dispara el permiso de cámara (requerido en iOS)
  $('#intro').classList.add('oculto');estado('cargando marcador…');
  try{
    if(!window.isSecureContext)throw new Error('se requiere HTTPS');
    const t=await (await fetch('targets/cartel.mind.b64',{cache:'no-store'})).text();
    const bin=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));
    const url=URL.createObjectURL(new Blob([bin],{type:'application/octet-stream'}));
    const sys=sc.systems['mindar-image-system'];
    // mindar-image solo lee imageTargetSrc en init: configurar el sistema directamente
    sys.setup({imageTargetSrc:url,maxTrack:1,filterMinCF:0.0001,filterBeta:0.001,missTolerance:10,warmupTolerance:3,showStats:false,uiLoading:'yes',uiScanning:'yes',uiError:'yes'});
    estado('pidiendo cámara…');await sys.start();
  }catch(e){estado('error: '+(e&&e.message||e));return;}
  setTimeout(()=>{if(!window.encontrado)estado('buscando marcador (apunta a la casa del cartel)');
    const b=document.createElement('button');b.textContent='Ver sin cámara';b.style.cssText='position:fixed;top:44px;right:8px;z-index:25';b.onclick=()=>location.href='visor.html';
    if(!window.encontrado)document.body.appendChild(b);},12000);
};
</script></body></html>
